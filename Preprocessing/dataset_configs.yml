BPIC19:
  file_name: 'bpic2019.zip'
  case_id: 'case:concept:name'
  event_name: 'concept:name'
  timestamp: 'time:timestamp'
  split_mode: 'workaround'
  case_len_quantile: 0.99
  cat_event_feature: ['org:resource']
