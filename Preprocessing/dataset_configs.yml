BPIC17:
  file_name: 'bpic2017.zip'
  case_id: 'case:concept:name'
  event_name: 'combined_activity'
  timestamp: 'time:timestamp'
  split_mode: 'strict'
  case_len_quantile: 1.0
  cat_event_feature: ['Action', 'org:resource', 'EventOrigin', 
                    'Accepted', 'Selected']
