NASA: 
  file_name: 'nasa.csv'
  case_id: 'case:concept:name'
  event_name: 'concept:name'
  timestamp: 'time:timestamp'
  case_len_quantile: 1.0
  split_mode: 'strict'
  cat_event_feature: ['apploc:filename', 'apploc:linenr', 'lifecycle:transition', 
                     'apploc:etype', 'apprun:excatchtype', 'apprun:exthrowtype']
  cat_case_feature: []
  num_event_feature: []
  num_case_feature: []

Sepsis:
  file_name: 'sepsis.csv'
  case_id: 'case:concept:name'
  event_name: 'concept:name'
  timestamp: 'time:timestamp'
  split_mode: 'strict'
  case_len_quantile: 1.0
  cat_event_feature: ['InfectionSuspected', 'org:group', 'DiagnosticBlood', 'DisfuncOrg', 
        'SIRSCritTachypnea', 'Hypotensie', 'SIRSCritHeartRate', 'Infusion',
        'DiagnosticArtAstrup', 'DiagnosticIC', 'DiagnosticSputum', 'DiagnosticLiquor', 
        'DiagnosticOther','SIRSCriteria2OrMore', 'DiagnosticXthorax', 'SIRSCritTemperature',
       'DiagnosticUrinaryCulture', 'SIRSCritLeucos', 'Oligurie', 'DiagnosticLacticAcid', 
       'Diagnose','Hypoxie', 'DiagnosticUrinarySediment', 'DiagnosticECG']
  cat_case_feature: []
  num_event_feature: ['Age', 'Leucocytes', 'CRP', 'LacticAcid']
  num_case_feature: []

